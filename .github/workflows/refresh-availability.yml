name: Refresh advising availability

on:
  # PAUSED. Uncomment the two lines below to resume automatic refreshes once
  # OUTLOOK_ICS_URL is set. GitHub may delay scheduled runs under load, and it
  # disables schedules in repos with no activity for 60 days.
  # schedule:
  #   - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-availability
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Without the calendar secret there is nothing to refresh. Skip quietly
      # rather than failing, so a half-configured repo does not mail you a
      # failure notice every time this runs.
      - name: Check for the calendar secret
        id: guard
        env:
          ICS_URL: ${{ secrets.OUTLOOK_ICS_URL }}
        run: |
          if [ -z "$ICS_URL" ]; then
            echo "::notice::OUTLOOK_ICS_URL is not set — nothing to refresh yet."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.ready == 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.guard.outputs.ready == 'true'
        run: pip install --quiet icalendar recurring_ical_events

      - name: Regenerate availability
        if: steps.guard.outputs.ready == 'true'
        env:
          ICS_URL: ${{ secrets.OUTLOOK_ICS_URL }}
        run: python3 scripts/refresh_availability.py

      - name: Commit if changed
        if: steps.guard.outputs.ready == 'true'
        run: |
          if git diff --quiet -- advising/availability.json; then
            echo "No change in availability."
            exit 0
          fi
          git config user.name "availability-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add advising/availability.json
          git commit -m "Refresh advising availability"
          git push
